<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e8">
  <title>STOCKROOM | 家のもの管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>.hero-section h1 em{color:#086776}</style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>.overview-grid{grid-template-columns:1fr 1fr}.item-card{grid-template-columns:1fr auto}.item-card:has(.item-image){grid-template-columns:auto 1fr auto}.item-image{width:72px;height:72px;object-fit:cover;border:1px solid var(--line)}.item-memo{color:var(--ink);font-size:11px;line-height:1.6;margin-top:9px}.item-memo::first-letter{color:var(--coral)}.location-tools{display:flex;align-items:center;gap:14px}.location-tools .button{height:36px;padding:0 12px;font-size:10px}@media(max-width:720px){.overview-grid{grid-template-columns:1fr 1fr}.item-card:has(.item-image){grid-template-columns:auto 1fr auto}.item-image{width:58px;height:58px}.location-tools{width:100%;justify-content:space-between}}</style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#top"><span>STOCK</span>ROOM</a>
    <div class="topbar-meta"><span class="live-dot"></span><span id="syncStatus">この端末に保存中</span><button class="login-button" id="loginButton" type="button" hidden>Googleでログイン</button></div>
  </header>

  <main id="top" class="page-shell">
    <section class="hero-section">
      <div class="eyebrow">HOME INVENTORY / 01</div>
      <h1><em>所持品管理</em></h1>
      <p class="hero-copy">バーコードやQRコードを読み取れば、しまった場所と状態をすぐに確認できます。</p>
      <div class="search-row">
        <div class="search-box">
          <span class="search-mark">⌕</span>
          <input id="searchInput" type="search" placeholder="名前、場所、コードで検索" autocomplete="off">
          <kbd>⌘ K</kbd>
        </div>
        <button class="button button-dark" id="scanButton" type="button"><span class="button-icon">⌗</span>読み取る</button>
      </div>
    </section>

    <section class="overview-grid" aria-label="概要">
      <div class="stat-block stat-primary"><span class="stat-label">所持品</span><strong id="itemCount">0</strong><small>件</small><div class="stat-accent"></div></div>
      <div class="stat-block"><span class="stat-label">保管場所</span><strong id="locationCount">0</strong><small>か所</small></div>
    </section>

    <section class="content-section">
      <div class="section-heading"><div><span class="eyebrow">YOUR COLLECTION</span><h2>所持品</h2></div><button class="button button-outline" id="addButton" type="button">＋ 新しく登録</button></div>
      <div class="filter-bar"><div class="filter-tabs" role="tablist"><button class="filter-tab is-active" data-filter="all" type="button">すべて <span id="allCount">0</span></button></div><div class="location-tools"><select id="locationFilter" aria-label="場所で絞り込む"><option value="all">場所：すべて</option></select><button class="button button-outline" id="locationCodeButton" type="button" hidden>場所コードを出力</button></div></div>
      <div id="itemList" class="item-list"></div>
      <div id="emptyState" class="empty-state"><div class="empty-symbol">＋</div><h3>まだアイテムがありません</h3><p>最初の物品を登録するか、コードを読み取って始めましょう。</p><button class="button button-dark" id="emptyAddButton" type="button">アイテムを登録</button></div>
    </section>
  </main>

  <div class="modal-backdrop" id="formModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><button class="close-button" data-close="formModal" type="button" aria-label="閉じる">×</button><span class="eyebrow">ADD TO COLLECTION</span><h2 id="formTitle">アイテムを登録</h2><form id="itemForm"><label>箱・アイテム名<input name="name" required placeholder="例：冬物衣類の箱"></label><label>保管場所<input name="location" required placeholder="例：納戸・上段"></label><label>状態<select name="status"><option value="storage">保管</option><option value="display">展示</option><option value="in-use">使用中</option></select></label><label>バーコード / QRコード<input name="code" id="codeInput" placeholder="未入力なら登録時に自動発行"></label><label>画像<input name="image" type="file" accept="image/*"></label><label>中身・メモ<textarea name="memo" rows="3" placeholder="例：セーター3枚、マフラー2本"></textarea></label><button class="button button-dark form-submit" type="submit">登録する</button></form></section></div>

  <div class="modal-backdrop" id="scannerModal" hidden><section class="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scannerTitle"><button class="close-button light-close" data-close="scannerModal" type="button" aria-label="閉じる">×</button><div class="eyebrow light-text">CODE SCANNER</div><h2 id="scannerTitle">コードを枠に合わせてください</h2><div class="video-wrap"><video id="cameraVideo" autoplay muted playsinline></video><div class="scan-frame"><i></i><i></i><i></i><i></i></div><div class="scan-line"></div></div><p id="scannerStatus" class="scanner-status">カメラを起動しています…</p><div class="manual-code"><input id="manualCode" placeholder="コードを手入力"><button class="button button-light" id="manualSearchButton" type="button">検索</button></div><p class="scanner-hint">カメラが使えない場合は、コードを手入力できます。</p></section></div>
  <div class="modal-backdrop" id="codeModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="codeTitle"><button class="close-button" data-close="codeModal" type="button" aria-label="閉じる">×</button><span class="eyebrow">PRINT CODE LABEL</span><h2 id="codeTitle">コードラベル</h2><div class="code-preview"><div id="qrOutput"></div><svg id="barcodeOutput"></svg></div><p id="codeCaption" class="code-caption"></p><div class="code-actions"><button class="button button-outline" id="downloadCodeButton" type="button">QR画像を保存</button><button class="button button-dark" id="printCodeButton" type="button">印刷する</button></div></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
